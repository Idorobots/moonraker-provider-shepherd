[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moonraker-provider-shepherd"
version = "0.1.0"
description = "GNU Shepherd machine provider for Moonraker"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Idorobots"}]

[project.urls]
Repository = "https://github.com/Idorobots/moonraker-provider-shepherd"

[tool.setuptools.packages.find]
include = ["moonraker_provider_shepherd*"]

[tool.setuptools.data-files]
"share/moonraker-provider-shepherd/scheme/moonraker" = ["scheme/moonraker/shepherd.scm"]
"share/moonraker-provider-shepherd/bin" = ["bin/moonraker-shepherd"]
"share/moonraker-provider-shepherd/patches" = ["patches/moonraker-0.11.0-shepherd.patch"]
"share/moonraker-provider-shepherd/examples" = ["examples/policy.scm"]
