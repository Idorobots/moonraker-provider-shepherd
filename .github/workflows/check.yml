# SPDX-License-Identifier: MIT
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Provider unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  guix:
    name: Shepherd integration and Moonraker compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GUILE_AUTO_COMPILE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Guix
        uses: PromyLOPh/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: false
      - name: Verify package versions
        run: python ci/check_version.py
      - name: Run helper and private-Shepherd tests
        run: guix time-machine -C ci/channels.scm -- shell guile guile-json shepherd make -- make check
      - name: Install Python build tools
        run: python -m pip install build 'setuptools>=77'
      - name: Verify Git-free source archive and wheel contents
        run: python tests/check_distribution.py
      - name: Test the actual Moonraker 0.11.0 HTTP API
        run: guix time-machine -C ci/channels.scm -- shell guile guile-json shepherd -- sh ci/check-upstream.sh
