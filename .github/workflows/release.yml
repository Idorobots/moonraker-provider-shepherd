# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/check.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the tag matches the Python package versions
        run: python ci/check_version.py --tag "$RELEASE_TAG"
      - name: Install build tools
        run: python -m pip install build
      - name: Build source archive and wheel
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          python -m build
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.whl > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.whl dist/SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG"
